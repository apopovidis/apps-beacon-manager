<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beacon Manager</title>
<style>
  :root{
    --ink:#0b1210; --surface:#0f1a16; --surface2:#132420; --border:#1f3a32;
    --text:#eef7f2; --muted:#9fb8ad; --accent:#7be6b0; --bad:#e67b7b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --status-good:#0ca30c; --status-warning:#fab219; --status-critical:#d03b3b;
  }
  @media(prefers-color-scheme:light){
    :root{ --ink:#f7fbf9; --surface:#ffffff; --surface2:#f0f5f2; --border:#dbe6e0; --text:#0f1a16; --muted:#516a5f;
      --status-good:#0ca30c; --status-warning:#fab219; --status-critical:#d03b3b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;}
  button,input,select{font:inherit;color:inherit}
  input,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
  button{background:var(--accent);color:#08130f;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
  button.small{padding:5px 10px;font-size:.78rem}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:280px;border-right:1px solid var(--border);padding:28px 24px;flex-shrink:0}
  .main{flex:1;padding:32px 36px 80px;max-width:1200px}
  .brand{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin-bottom:4px}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:24px}
  .side-nav-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--muted)}
  .side-nav-item:hover{background:var(--surface2);color:var(--text)}
  .side-nav-item.active{background:var(--surface2);color:var(--text)}
  figure{margin:0 0 20px}
  figure svg{width:100%;height:auto;color:var(--text)}
  figcaption{color:var(--muted);font-size:.85rem;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  figcaption code{font-size:.9em}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:20px}
  .card h2{margin:0 0 4px;font-size:1.05rem}
  .card .hint{color:var(--muted);font-size:.82rem;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.68rem}
  tr:last-child td{border-bottom:none}
  code{font-family:var(--mono);background:var(--surface2);padding:2px 6px;border-radius:5px;font-size:.85em}
  .badge{display:inline-block;font-size:.68rem;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
  .badge.healthy{color:var(--status-good);border-color:var(--status-good)}
  .badge.unreachable{color:var(--status-critical);border-color:var(--status-critical)}
  .badge.unknown{color:var(--muted)}
  .badge.shared{color:var(--accent);border-color:var(--accent)}
  .badge.dedicated{color:var(--status-warning);border-color:var(--status-warning)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);font-size:.85rem;padding:16px 0;text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:10}
  #gate .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px}
  .hidden{display:none !important}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:600px;max-width:100%;max-height:85vh;overflow:auto}
  .modal h2{margin:0 0 4px}
  .platform-row{display:grid;grid-template-columns:1.2fr 1fr 120px auto;gap:8px;margin-bottom:8px;align-items:center}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .snippet-block{margin-bottom:16px}
  .snippet-block .platform-name{font-weight:700;margin-bottom:6px}
  .snippet-block pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:.76rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:0 0 6px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="brand">Beacon Manager</div>
    <p class="sub">Enter the manager admin key.</p>
    <input id="adminKeyInput" type="password" placeholder="Admin key">
    <div style="height:10px"></div>
    <button id="adminKeySubmit" style="width:100%">Continue</button>
  </div>
</div>

<div class="layout hidden" id="app">
  <div class="sidebar">
    <div class="brand">Beacon Manager<span>.</span></div>
    <div class="sub">Central registry for every Beacon installation</div>
    <div class="side-nav">
      <div class="side-nav-item active" id="navDashboard">Dashboard</div>
      <div class="side-nav-item" id="navHowItWorks">How it works</div>
    </div>
  </div>

  <div class="main">
    <div id="dashboardView">
      <div class="card">
        <h2>Instances</h2>
        <div class="hint">Every Beacon deployment this Manager knows about and can reach.</div>
        <div id="instancesTable"></div>
        <div style="height:14px"></div>
        <form id="registerInstanceForm">
          <div class="grid2">
            <input id="instName" placeholder="Instance name (e.g. Shared prod)">
            <input id="instOrigin" placeholder="Origin URL (e.g. http://localhost:4101)">
          </div>
          <div style="height:8px"></div>
          <div class="grid2">
            <select id="instKind">
              <option value="shared">Shared</option>
              <option value="dedicated">Dedicated</option>
            </select>
            <input id="instBootstrapKey" type="password" placeholder="Bootstrap admin key (used once, never stored)">
          </div>
          <div style="height:10px"></div>
          <button type="submit">Register instance</button>
        </form>
      </div>

      <div id="productsByInstance"></div>
    </div>

    <div id="howItWorksView" class="hidden"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="productModalBackdrop">
  <div class="modal" id="productModal"></div>
</div>

<script>
const state = { adminKey: localStorage.getItem("manager_admin_key") || "", instances: [], products: [] };

function api(path, opts) {
  return fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-admin-key": state.adminKey, ...(opts && opts.headers) },
  }).then(async (r) => {
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    return r.json();
  });
}

function esc(value) { return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function showApp() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadAll();
}

// --- Nav: Dashboard vs. How it works --------------------------------------

function setActiveNav(id) {
  document.querySelectorAll(".side-nav-item").forEach((el) => el.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}

document.getElementById("navDashboard").onclick = () => {
  setActiveNav("navDashboard");
  document.getElementById("dashboardView").classList.remove("hidden");
  document.getElementById("howItWorksView").classList.add("hidden");
};

document.getElementById("navHowItWorks").onclick = () => {
  setActiveNav("navHowItWorks");
  document.getElementById("dashboardView").classList.add("hidden");
  const view = document.getElementById("howItWorksView");
  view.classList.remove("hidden");
  if (!view.dataset.rendered) { renderHowItWorks(); view.dataset.rendered = "1"; }
};

// --- How it works: shared vs. dedicated instances, and how the embeddable
// scoped dashboard re-verifies access on every request. --------------------

function renderHowItWorks() {
  const view = document.getElementById("howItWorksView");
  view.innerHTML = `
    <h2 style="margin:0 0 4px">How it works</h2>
    <p class="muted" style="max-width:640px;margin-bottom:22px">Manager doesn't run analytics itself — it's a registry that fans out live to every Beacon instance it knows about: as many shared instances and as many dedicated instances as you register, each one just another row.</p>

    <div class="card">
      <figure>
        <svg viewBox="0 0 920 440" role="img" aria-label="Shared instance vs dedicated instance: same Beacon codebase, different compute and database footprint">
          <defs>
            <marker id="hiw-arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
          </defs>
          <text x="230" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Most products — shared instance</text>
          <text x="690" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">A promoted product — dedicated</text>

          <text x="230" y="48" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">web / iOS / Android / server apps (SDK)</text>
          <line x1="230" y1="54" x2="230" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow1)"/>
          <text x="238" y="68" font-size="10" opacity="0.7" fill="currentColor">apiKey + ingestUrl</text>

          <rect x="60" y="80" width="340" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="230" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Beacon service</text>
          <text x="230" y="124" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">Express — ingest + admin + dashboard</text>

          <line x1="230" y1="144" x2="230" y2="178" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow1)"/>
          <text x="238" y="165" font-size="10" opacity="0.7" fill="currentColor">queries, scoped by project_id</text>

          <rect x="60" y="180" width="340" height="170" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="230" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Shared Postgres</text>
          <rect x="80" y="220" width="90" height="36" rx="6" fill="currentColor" opacity="0.12"/>
          <text x="125" y="243" text-anchor="middle" font-size="11" fill="currentColor">Product A</text>
          <rect x="185" y="220" width="90" height="36" rx="6" fill="currentColor" opacity="0.12"/>
          <text x="230" y="243" text-anchor="middle" font-size="11" fill="currentColor">Product B</text>
          <rect x="290" y="220" width="90" height="36" rx="6" fill="currentColor" opacity="0.12"/>
          <text x="335" y="243" text-anchor="middle" font-size="11" fill="currentColor">Product C</text>
          <text x="230" y="285" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">every row tagged project_id / group_id</text>
          <text x="230" y="305" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">one connection pool, one process</text>

          <text x="690" y="48" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">that product's apps (SDK)</text>
          <line x1="690" y1="54" x2="690" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow1)"/>
          <text x="698" y="68" font-size="10" opacity="0.7" fill="currentColor">apiKey + ingestUrl</text>

          <rect x="520" y="80" width="340" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="690" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Beacon service</text>
          <text x="690" y="124" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">same codebase — separate deployment</text>

          <line x1="690" y1="144" x2="690" y2="178" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow1)"/>
          <text x="698" y="165" font-size="10" opacity="0.7" fill="currentColor">queries</text>

          <rect x="520" y="180" width="340" height="170" rx="10" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
          <text x="690" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="var(--accent)">Dedicated Postgres</text>
          <rect x="645" y="220" width="90" height="36" rx="6" fill="var(--accent)" opacity="0.18"/>
          <text x="690" y="243" text-anchor="middle" font-size="11" fill="currentColor">Product D</text>
          <text x="690" y="285" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">its own connection pool, own storage</text>
          <text x="690" y="305" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">no other product's rows ever pass through</text>

          <line x1="440" y1="380" x2="440" y2="410" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
          <text x="460" y="400" font-size="11" opacity="0.7" fill="currentColor">no shared connection between the two</text>
        </svg>
        <figcaption><strong>Same code, different footprint.</strong> Every Beacon deployment runs the identical codebase. Most products share one instance and one database — isolated only by <code>project_id</code>, cheap to run. A product that outgrows the shared pool (traffic, storage, noisy-neighbor query load) gets promoted: its own Beacon process, its own database, registered here as a second instance. There's no limit on how many of either kind you register — additional shared instances (e.g. one per region) and additional dedicated instances each show up here as their own row, checked and synced independently.</figcaption>
      </figure>
    </div>

    <div class="card">
      <figure>
        <svg viewBox="0 0 920 500" role="img" aria-label="Beacon Manager registers every instance with a scoped credential and fans out live; the embeddable agency dashboard re-verifies product ownership on every request">
          <defs>
            <marker id="hiw-arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
          </defs>

          <rect x="40" y="30" width="320" height="70" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">Beacon Manager (here)</text>
          <text x="200" y="76" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">registry only — no analytics data</text>

          <line x1="200" y1="100" x2="200" y2="126" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>
          <rect x="40" y="128" width="320" height="40" rx="8" fill="currentColor" opacity="0.08"/>
          <text x="200" y="153" text-anchor="middle" font-size="10.5" opacity="0.75" fill="currentColor">instances · products · embed credentials</text>

          <line x1="360" y1="55" x2="560" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>
          <text x="460" y="42" text-anchor="middle" font-size="10" fill="currentColor">scoped credential</text>
          <text x="460" y="72" text-anchor="middle" font-size="9.5" opacity="0.6" fill="currentColor">(auth_provider=manager, not the master key)</text>
          <line x1="360" y1="65" x2="740" y2="65" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>

          <!-- Shared instances: any number can be registered — stacked cards signal "one or more" -->
          <rect x="570" y="32" width="150" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
          <rect x="565" y="27" width="150" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
          <rect x="560" y="22" width="150" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="635" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Shared instances</text>
          <text x="635" y="64" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">any number, many products</text>

          <!-- Dedicated instances: also any number, one product each -->
          <rect x="750" y="32" width="155" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
          <rect x="745" y="27" width="155" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
          <rect x="740" y="22" width="155" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="817" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Dedicated instances</text>
          <text x="817" y="64" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">any number, one product each</text>

          <rect x="40" y="210" width="200" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="140" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Agency browser</text>

          <line x1="140" y1="260" x2="140" y2="288" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>
          <text x="150" y="278" font-size="10" opacity="0.7" fill="currentColor">username + password</text>
          <text x="150" y="290" font-size="9.5" opacity="0.55" fill="currentColor">(product-scoped — not an admin key)</text>

          <rect x="40" y="300" width="300" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <text x="190" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">GET /embed/:productId</text>
          <text x="190" y="340" text-anchor="middle" font-size="10" opacity="0.6" fill="currentColor">Manager-hosted login + dashboard page</text>

          <line x1="190" y1="356" x2="190" y2="384" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>
          <text x="200" y="374" font-size="10" opacity="0.7" fill="currentColor">session token</text>

          <rect x="40" y="394" width="380" height="70" rx="10" fill="var(--accent)" fill-opacity="0.08" stroke="var(--accent)" stroke-width="2"/>
          <text x="230" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent)">/public/embed/* re-checks scope</text>
          <text x="230" y="438" text-anchor="middle" font-size="10.5" opacity="0.8" fill="currentColor">project &#8712; this session's product — on every request,</text>
          <text x="230" y="453" text-anchor="middle" font-size="10.5" opacity="0.8" fill="currentColor">not just once at login</text>

          <line x1="420" y1="430" x2="560" y2="430" stroke="currentColor" stroke-width="1.5" marker-end="url(#hiw-arrow2)"/>
          <text x="490" y="418" text-anchor="middle" font-size="10" opacity="0.7" fill="currentColor">proxies</text>
          <text x="620" y="434" font-size="10.5" opacity="0.75" fill="currentColor">whichever instance</text>
          <text x="620" y="448" font-size="10.5" opacity="0.75" fill="currentColor">hosts that product right now</text>
          <line x1="700" y1="425" x2="635" y2="96" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
          <line x1="700" y1="425" x2="817" y2="96" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
        </svg>
        <figcaption><strong>Manager never trusts a login once and forgets it.</strong> Register as many shared and dedicated instances as you want — Manager treats each one identically, whether it's the first or the fifth. Registering an instance mints a scoped credential (never that instance's master key), so access is independently revocable — see "Remove" on the Dashboard tab. An agency's product-scoped session (created via "Embed access" on a product) gets re-checked against that product's live project list on every single request the embed dashboard makes — not just at login — so a session for one product can never be replayed against another's data, even if the underlying instance later changes.</figcaption>
      </figure>
    </div>
  `;
}

document.getElementById("adminKeySubmit").onclick = async () => {
  const key = document.getElementById("adminKeyInput").value.trim();
  if (!key) return;
  state.adminKey = key;
  try {
    await fetch("/admin/instances", { headers: { "x-admin-key": key } }).then((r) => {
      if (!r.ok) throw new Error("Invalid admin key.");
    });
    localStorage.setItem("manager_admin_key", key);
    showApp();
  } catch (e) {
    alert(e.message);
  }
};

if (state.adminKey) showApp();

async function loadAll() {
  [state.instances, state.products] = await Promise.all([api("/admin/instances"), api("/admin/products")]);
  renderInstances();
  renderProductsByInstance();
}

function renderInstances() {
  const el = document.getElementById("instancesTable");
  if (!state.instances.length) { el.innerHTML = `<div class="empty">No instances registered yet.</div>`; return; }
  el.innerHTML = `
    <table><thead><tr><th>Name</th><th>Kind</th><th>Origin</th><th>Status</th><th>Last checked</th><th></th></tr></thead>
    <tbody>${state.instances.map((i) => `
      <tr>
        <td>${esc(i.name)}</td>
        <td><span class="badge ${i.kind}">${i.kind}</span></td>
        <td><code>${esc(i.origin_url)}</code></td>
        <td><span class="badge ${i.status}">${i.status}</span></td>
        <td class="muted">${i.last_checked_at ? new Date(i.last_checked_at).toLocaleString() : "—"}</td>
        <td class="row">
          <button type="button" class="ghost small" data-check="${i.id}">Check</button>
          <button type="button" class="ghost small" data-sync="${i.id}">Sync products</button>
          <button type="button" class="ghost small" data-remove="${i.id}">Remove</button>
        </td>
      </tr>
    `).join("")}</tbody></table>
  `;
  el.querySelectorAll("[data-check]").forEach((btn) => btn.onclick = async () => {
    await api(`/admin/instances/${btn.dataset.check}/check`, { method: "POST" });
    await loadAll();
  });
  el.querySelectorAll("[data-sync]").forEach((btn) => btn.onclick = async () => {
    try {
      const result = await api(`/admin/instances/${btn.dataset.sync}/sync-products`, { method: "POST" });
      alert(`Synced ${result.synced} product(s) from this instance.`);
      await loadAll();
    } catch (e) { alert("Sync failed: " + (e.message || e)); }
  });
  el.querySelectorAll("[data-remove]").forEach((btn) => btn.onclick = async () => {
    const inst = state.instances.find((i) => i.id === btn.dataset.remove);
    if (!confirm(`Remove "${inst.name}" from Manager? Its products stay on the instance, just untracked here.`)) return;
    await api(`/admin/instances/${btn.dataset.remove}`, { method: "DELETE" });
    await loadAll();
  });
}

// Products, grouped by the instance they live on — so managing "all
// products on this shared instance" or "this dedicated one" is one card,
// not a scan across a flat cross-instance table.
function renderProductsByInstance() {
  const container = document.getElementById("productsByInstance");
  if (!state.instances.length) {
    container.innerHTML = `<div class="card"><div class="empty">Register an instance above to start creating products.</div></div>`;
    return;
  }

  container.innerHTML = state.instances.map((inst) => {
    const products = state.products.filter((p) => p.instance_id === inst.id);
    return `
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <h2 style="margin:0">${esc(inst.name)} <span class="badge ${inst.kind}" style="margin-left:6px">${inst.kind}</span> <span class="badge ${inst.status}" style="margin-left:4px">${inst.status}</span></h2>
            <div class="hint" style="margin:4px 0 0"><code>${esc(inst.origin_url)}</code></div>
          </div>
          <button type="button" class="small" data-new-product="${inst.id}">+ New product</button>
        </div>
        <div style="height:14px"></div>
        ${products.length ? `
          <table><thead><tr><th>Product</th><th>Apps</th><th></th></tr></thead>
          <tbody>${products.map((p) => `
            <tr>
              <td>${esc(p.name)}</td>
              <td>${p.reachable ? p.projectCount : `<span class="muted">unreachable</span>`}</td>
              <td class="row">
                <button type="button" class="ghost small" data-view-apps="${p.id}">View apps</button>
                <button type="button" class="ghost small" data-access="${p.id}">Embed access</button>
              </td>
            </tr>
          `).join("")}</tbody></table>
        ` : `<div class="empty">No products yet on this instance.</div>`}
      </div>
    `;
  }).join("");

  container.querySelectorAll("[data-new-product]").forEach((btn) => btn.onclick = () => openNewProductModal(btn.dataset.newProduct));
  container.querySelectorAll("[data-view-apps]").forEach((btn) => btn.onclick = () => openViewAppsModal(btn.dataset.viewApps));
  container.querySelectorAll("[data-access]").forEach((btn) => btn.onclick = () => openEmbedAccessModal(btn.dataset.access));
}

// --- View apps modal: a product's actual projects on its instance, with
// key rotation — proxies Beacon's own POST /projects/:id/rotate-key. -------

async function openViewAppsModal(productId) {
  const product = state.products.find((p) => p.id === productId);
  const backdrop = document.getElementById("productModalBackdrop");
  const modal = document.getElementById("productModal");
  modal.innerHTML = `<h2>Apps — ${esc(product.name)}</h2><p class="muted">Loading&hellip;</p>`;
  backdrop.classList.remove("hidden");

  try {
    const projects = await api(`/admin/products/${productId}/projects`);
    renderAppsList(product, projects);
  } catch (e) {
    modal.innerHTML = `<h2>Apps — ${esc(product.name)}</h2><p class="muted">Couldn't load: ${esc(e.message || e)}</p><div class="modal-actions"><button type="button" class="ghost" id="appsDone">Close</button></div>`;
    modal.querySelector("#appsDone").onclick = () => backdrop.classList.add("hidden");
  }
}

function renderAppsList(product, projects) {
  const modal = document.getElementById("productModal");
  modal.innerHTML = `
    <h2>Apps — ${esc(product.name)}</h2>
    <p class="muted" style="margin-bottom:14px">On ${esc(product.instance_name)}. Rotating a key invalidates the old one immediately — update that app's SDK config right after.</p>
    ${projects.length ? `
      <table><thead><tr><th>App</th><th>Tier</th><th>API key</th><th></th></tr></thead>
      <tbody>${projects.map((p) => `
        <tr>
          <td>${esc(p.name)}</td>
          <td><span class="badge">${esc(p.tier)}</span></td>
          <td><code>${esc(p.api_key)}</code></td>
          <td class="row">
            <button type="button" class="ghost small" data-copy-key="${esc(p.api_key)}">Copy</button>
            <button type="button" class="ghost small" data-rotate="${p.id}">Rotate key</button>
          </td>
        </tr>
      `).join("")}</tbody></table>
    ` : `<div class="empty">No apps on this product yet — drag existing projects onto it from Beacon's own dashboard.</div>`}
    <div class="modal-actions"><button type="button" class="ghost" id="appsDone">Close</button></div>
  `;
  modal.querySelectorAll("[data-copy-key]").forEach((btn) => btn.onclick = (e) => {
    navigator.clipboard.writeText(btn.dataset.copyKey);
    e.target.textContent = "Copied!";
    setTimeout(() => { e.target.textContent = "Copy"; }, 1500);
  });
  modal.querySelectorAll("[data-rotate]").forEach((btn) => btn.onclick = async () => {
    if (!confirm("Rotate this app's key? The old key stops working immediately.")) return;
    try {
      await api(`/admin/products/${product.id}/projects/${btn.dataset.rotate}/rotate-key`, { method: "POST" });
      const refreshed = await api(`/admin/products/${product.id}/projects`);
      renderAppsList(product, refreshed);
    } catch (e2) {
      alert("Couldn't rotate key: " + (e2.message || e2));
    }
  });
  modal.querySelector("#appsDone").onclick = () => document.getElementById("productModalBackdrop").classList.add("hidden");
}

// --- Embed access modal: agency logins for the product-scoped /beacon UI --

async function openEmbedAccessModal(productId) {
  const product = state.products.find((p) => p.id === productId);
  const backdrop = document.getElementById("productModalBackdrop");
  const modal = document.getElementById("productModal");
  modal.innerHTML = `<h2>Embed access — ${esc(product.name)}</h2><p class="muted">Loading&hellip;</p>`;
  backdrop.classList.remove("hidden");

  const creds = await api(`/admin/products/${productId}/embed-credentials`);
  modal.innerHTML = `
    <h2>Embed access — ${esc(product.name)}</h2>
    <p class="muted" style="margin-bottom:14px">Logins for the scoped <code>/beacon</code> dashboard — each can see only this product's projects, nothing else.</p>
    <div id="credList">${creds.length ? `
      <table><thead><tr><th>Username</th><th>Created</th><th></th></tr></thead>
      <tbody>${creds.map((c) => `
        <tr>
          <td>${esc(c.username)}</td>
          <td class="muted">${new Date(c.created_at).toLocaleDateString()}</td>
          <td><button type="button" class="ghost small" data-revoke="${c.id}">Revoke</button></td>
        </tr>
      `).join("")}</tbody></table>
    ` : `<div class="empty">No embed logins yet.</div>`}</div>
    <div style="height:14px"></div>
    <form id="newCredForm">
      <div class="grid2">
        <input id="credUsername" placeholder="Username">
        <input id="credPassword" type="password" placeholder="Password (min 8 chars)">
      </div>
      <div style="height:10px"></div>
      <button type="submit" class="small">+ Create login</button>
    </form>
    <div class="modal-actions"><button type="button" class="ghost" id="accessDone">Close</button></div>
  `;
  modal.querySelectorAll("[data-revoke]").forEach((btn) => btn.onclick = async () => {
    await api(`/admin/embed-credentials/${btn.dataset.revoke}`, { method: "DELETE" });
    openEmbedAccessModal(productId);
  });
  modal.querySelector("#newCredForm").onsubmit = async (e) => {
    e.preventDefault();
    const username = modal.querySelector("#credUsername").value.trim();
    const password = modal.querySelector("#credPassword").value;
    if (!username || !password) return alert("Username and password are required.");
    try {
      await api(`/admin/products/${productId}/embed-credentials`, { method: "POST", body: JSON.stringify({ username, password }) });
      openEmbedAccessModal(productId);
    } catch (e2) {
      alert("Couldn't create login: " + (e2.message || e2));
    }
  };
  modal.querySelector("#accessDone").onclick = () => backdrop.classList.add("hidden");
}

// --- New Product modal ---------------------------------------------------

const PLATFORM_OPTIONS = [
  { value: "web", label: "Web" },
  { value: "ios", label: "iOS" },
  { value: "android", label: "Android" },
  { value: "server", label: "Server" },
  { value: "other", label: "Other" },
];

function slugify(text) {
  return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function platformRowHtml(index) {
  return `
    <div class="platform-row" data-row="${index}">
      <input class="platform-name" placeholder="Surface name (e.g. Web app)">
      <input class="platform-slug" placeholder="slug">
      <select class="platform-kind">
        ${PLATFORM_OPTIONS.map((o) => `<option value="${o.value}">${o.label}</option>`).join("")}
      </select>
      <button type="button" class="ghost small platform-remove" title="Remove">&times;</button>
    </div>
  `;
}

function wirePlatformRow(row) {
  const nameInput = row.querySelector(".platform-name");
  const slugInput = row.querySelector(".platform-slug");
  nameInput.addEventListener("input", () => {
    if (!slugInput.dataset.touched) slugInput.value = slugify(nameInput.value);
  });
  slugInput.addEventListener("input", () => { slugInput.dataset.touched = "1"; });
  row.querySelector(".platform-remove").onclick = () => {
    if (row.parentElement.children.length > 1) row.remove();
  };
}

function openNewProductModal(preselectInstanceId) {
  if (!state.instances.length) return alert("Register an instance first.");
  const backdrop = document.getElementById("productModalBackdrop");
  const modal = document.getElementById("productModal");
  modal.innerHTML = `
    <h2>New product</h2>
    <p class="muted" style="margin-bottom:14px">Creates a product on the instance you choose, plus one project per platform.</p>
    <select id="productInstance" style="margin-bottom:10px">
      ${state.instances.map((i) => `<option value="${i.id}" ${i.id === preselectInstanceId ? "selected" : ""}>${esc(i.name)} (${esc(i.origin_url)})</option>`).join("")}
    </select>
    <input id="productName" placeholder="Product name (e.g. Acme Marketing Site)" style="margin-bottom:14px">
    <div id="platformRows"></div>
    <button type="button" class="ghost small" id="addPlatformRow">+ Add platform</button>
    <div class="modal-actions">
      <button type="button" class="ghost" id="productCancel">Cancel</button>
      <button type="button" id="productSubmit">Create product</button>
    </div>
  `;
  const rows = modal.querySelector("#platformRows");
  rows.innerHTML = platformRowHtml(0);
  wirePlatformRow(rows.querySelector('[data-row="0"]'));
  modal.querySelector("#addPlatformRow").onclick = () => {
    rows.insertAdjacentHTML("beforeend", platformRowHtml(rows.children.length));
    wirePlatformRow(rows.lastElementChild);
  };
  modal.querySelector("#productCancel").onclick = () => backdrop.classList.add("hidden");
  modal.querySelector("#productSubmit").onclick = submitNewProduct;
  backdrop.classList.remove("hidden");
}

function sdkSnippet(project, platform, originUrl) {
  if (platform === "web") {
    return `import { init } from "@autopilot/analytics-sdk/browser";\n\nconst beacon = init({\n  apiKey: "${project.api_key}",\n  source: "web",\n  ingestUrl: "${originUrl}",\n});`;
  }
  if (platform === "ios" || platform === "android") {
    return `import { init } from "@autopilot/analytics-sdk/react-native";\n\nconst beacon = init({\n  apiKey: "${project.api_key}",\n  source: "${platform}",\n  ingestUrl: "${originUrl}",\n});`;
  }
  if (platform === "server") {
    return `import { init } from "@autopilot/analytics-sdk/node";\n\nconst beacon = init({\n  apiKey: "${project.api_key}",\n  source: "server",\n  ingestUrl: "${originUrl}",\n});`;
  }
  return `# Python\nfrom beacon_analytics import init\nbeacon = init("${project.api_key}", "other", ingest_url="${originUrl}")`;
}

async function submitNewProduct() {
  const modal = document.getElementById("productModal");
  const instanceId = modal.querySelector("#productInstance").value;
  const instance = state.instances.find((i) => i.id === instanceId);
  const name = modal.querySelector("#productName").value.trim();
  if (!name) return alert("Product name is required.");
  const platforms = Array.from(modal.querySelectorAll(".platform-row")).map((row) => ({
    name: row.querySelector(".platform-name").value.trim(),
    slug: row.querySelector(".platform-slug").value.trim(),
    platform: row.querySelector(".platform-kind").value,
  }));
  if (platforms.some((p) => !p.name || !p.slug)) return alert("Every platform needs a name and a slug.");

  try {
    const result = await api("/admin/products", { method: "POST", body: JSON.stringify({ instanceId, name, platforms }) });
    renderProductResults(result, instance.origin_url);
    await loadAll();
  } catch (e) {
    alert("Couldn't create product: " + (e.message || e));
  }
}

function renderProductResults(result, originUrl) {
  const modal = document.getElementById("productModal");
  modal.innerHTML = `
    <h2>${esc(result.group.name)} is ready</h2>
    <p class="muted" style="margin-bottom:14px">Paste the matching snippet into each surface's codebase to start sending events.</p>
    <div id="snippetList"></div>
    <div class="modal-actions"><button type="button" id="productDone">Done</button></div>
  `;
  const list = modal.querySelector("#snippetList");
  result.projects.forEach((project) => {
    const platform = project.platform || "web";
    const block = document.createElement("div");
    block.className = "snippet-block";
    block.innerHTML = `
      <div class="platform-name">${esc(project.name)} <span class="muted" style="font-weight:400">(${esc(project.slug)})</span></div>
      <pre>${esc(sdkSnippet(project, platform, originUrl))}</pre>
      <button type="button" class="ghost small" data-copy>Copy</button>
    `;
    block.querySelector("[data-copy]").onclick = (e) => {
      navigator.clipboard.writeText(sdkSnippet(project, platform, originUrl));
      e.target.textContent = "Copied!";
      setTimeout(() => { e.target.textContent = "Copy"; }, 1500);
    };
    list.appendChild(block);
  });
  modal.querySelector("#productDone").onclick = () => document.getElementById("productModalBackdrop").classList.add("hidden");
}

document.getElementById("registerInstanceForm").onsubmit = async (e) => {
  e.preventDefault();
  const name = document.getElementById("instName").value.trim();
  const originUrl = document.getElementById("instOrigin").value.trim();
  const kind = document.getElementById("instKind").value;
  const bootstrapAdminKey = document.getElementById("instBootstrapKey").value.trim();
  if (!name || !originUrl || !bootstrapAdminKey) return alert("Name, origin URL, and bootstrap admin key are all required.");
  try {
    await api("/admin/instances", { method: "POST", body: JSON.stringify({ name, originUrl, kind, bootstrapAdminKey }) });
    document.getElementById("registerInstanceForm").reset();
    await loadAll();
  } catch (e2) {
    alert("Couldn't register instance: " + (e2.message || e2));
  }
};
</script>
