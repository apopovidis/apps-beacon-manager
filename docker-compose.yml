services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: manager
      POSTGRES_DB: manager
    ports:
      - "54333:5432"
    volumes:
      - beacon_manager_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d manager"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  beacon_manager_pg:
