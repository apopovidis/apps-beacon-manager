<!doctype html>
<!--
  Drop this file at your web app's own /beacon route (or wherever your
  framework serves a static route/page from) to give your team — or an
  agency managing this site — a scoped analytics login on your own domain.

  Replace MANAGER_ORIGIN and PRODUCT_ID in the iframe src below with values
  from Beacon Manager's Products view: the Manager origin you're running,
  and this product's id. Everything else (login, scoping, data) is handled
  by Manager itself — this file is just a pointer to it, the same pattern
  most embeddable analytics/support widgets use.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics</title>
<style>
  html,body{margin:0;height:100%;background:#0b1210}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe
  src="https://MANAGER_ORIGIN/embed/PRODUCT_ID"
  allow="clipboard-write"
></iframe>
</body>
</html>
